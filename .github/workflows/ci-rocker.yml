name: CI - Dockerfile.rocker

on:
  pull_request:
    paths:
      - "Dockerfile.rocker"
      - "install_r_packages.R"
      - "docker-compose.ci.yml"
      - ".github/workflows/ci-rocker.yml"
  push:
    branches: [develop]
    paths:
      - "Dockerfile.rocker"
      - "install_r_packages.R"
      - "docker-compose.ci.yml"
      - ".github/workflows/ci-rocker.yml"

jobs:
  build-rocker:
    name: Build Dockerfile.rocker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile.rocker
        run: |
          docker build -t bsyncr-server-rocker \
            --build-arg BASE_IMAGE_TAG=4.4.3 \
            -f Dockerfile.rocker .

      - name: Run smoke test
        run: |
          docker run -d -p 8080:5000 \
            --name bsyncr-rocker \
            bsyncr-server-rocker
          echo "Waiting for server to start..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Server ready (took ${i}s)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "FAIL: Server did not start within 60s"
              docker logs bsyncr-rocker | tail -30
              exit 1
            fi
            sleep 1
          done
          curl -f http://localhost:8080/health
          echo ""
          echo "Health check passed"

      - name: Cleanup
        if: always()
        run: |
          docker stop bsyncr-rocker 2>/dev/null || true
          docker rm bsyncr-rocker 2>/dev/null || true
